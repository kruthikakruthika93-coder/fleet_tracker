{% extends 'base.html' %}
{% block title %}Delete vehicle{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4>Delete {{ vehicle.registration_number }}?</h4>
                <p class="text-muted">This also deletes its assignments, mileage, maintenance and expense records. This can't be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, delete</button>
                    <a href="{% url 'vehicle_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
